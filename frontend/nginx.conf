server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The browser only talks to nginx; /api is proxied to Flask.
    # Same origin = no CORS and the backend port stays private.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Files with a content hash in their name can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: any unknown route (e.g. /rated) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
